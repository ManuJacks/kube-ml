name: CI/CD Pipeline

on:
  push:
    branches: [ "development", "main" ]
  pull_request:
    branches: [ "development", "main" ]

jobs:
  test:
    name: Run Unit Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu 'torch>=2.0.0'
          pip install -e .

      - name: Run Django & Tensor Bridge Tests
        run: |
          python manage.py test core

      - name: Validate Python formatting and syntax
        run: |
          python -m compileall -q config core mcp

      - name: Validate Kubernetes manifests
        run: |
          kubectl kustomize clusters/minikube/apps >/dev/null

      - name: Validate Helm templates
        uses: azure/setup-helm@v4
        with:
          version: v3.15.0

      - run: helm lint kube-ml-chart
      - run: helm template kube-ml kube-ml-chart >/dev/null

  docker-build:
    name: Validate Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: kube-ml-platform:latest
