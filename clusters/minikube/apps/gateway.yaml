apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kube-ml-gateway
  namespace: ml-workloads
spec:
  gatewayClassName: istio
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - name: django-credential-secret
    allowedRoutes:
      namespaces:
        from: Same
