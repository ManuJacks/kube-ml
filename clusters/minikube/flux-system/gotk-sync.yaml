apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: kube-ml
  namespace: flux-system
spec:
  interval: 1m0s
  url: https://github.com/ManuJacks/kube-ml.git
  ref:
    branch: development
  ignore: |
    # Exclude non-cluster files to optimize reconciliation
    /*
    !/clusters/minikube/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-ml-apps
  namespace: flux-system
spec:
  interval: 5m0s
  path: ./clusters/minikube/apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: kube-ml
  targetNamespace: ml-workloads
