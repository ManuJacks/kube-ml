apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: django-web-route
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
  - name: django-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: {{ .Release.Name }}-service
      port: 8000

